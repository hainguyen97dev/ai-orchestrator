name: Agent auto-merge

# Merges same-repo PRs into main that carry the `automerge` label, once the CI
# `ci-ok` gate and every other check on the head commit have passed.
# Native GitHub auto-merge needs branch protection, which this private repo's
# plan does not offer, so this workflow re-evaluates after each check workflow.
#
# Opt in:  gh pr create ... --label automerge   (or add the label later)
# Veto:    add the `do-not-merge` label, or remove `automerge`.
#
# Merges made with GITHUB_TOKEN do not trigger push workflows on main. Set an
# AUTOMERGE_TOKEN secret (fine-grained PAT: contents + pull requests write)
# if CI should run on main after an auto-merge.

on:
  pull_request:
    types: [labeled, ready_for_review, reopened]
  workflow_run:
    workflows: [CI, gitleaks]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (empty = every open PR labelled automerge)
        required: false
      dry_run:
        description: Report only, do not merge
        type: boolean
        default: false

permissions:
  # gh pr view --json statusCheckRollup resolves each check's workflow run,
  # which needs actions: read; without it GraphQL errors and nothing merges.
  actions: read
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: agent-automerge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/agent-automerge.sh
          sparse-checkout-cone-mode: false

      - name: Merge ready PRs
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number || inputs.pr || '' }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests.*.number) }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          prs=()
          if [[ -n $PR_FROM_EVENT ]]; then
            prs=("$PR_FROM_EVENT")
          elif [[ -n $RUN_SHA ]]; then
            mapfile -t prs < <(jq -r '.[]? // empty' <<<"$RUN_PRS")
            if [[ ${#prs[@]} -eq 0 ]]; then
              mapfile -t prs < <(gh pr list --state open --search "$RUN_SHA" --json number -q '.[].number')
            fi
            [[ ${#prs[@]} -eq 0 ]] && { echo "no open PR for $RUN_SHA"; exit 0; }
          fi
          bash scripts/agent-automerge.sh "${prs[@]}"
