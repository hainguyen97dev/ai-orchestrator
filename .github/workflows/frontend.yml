name: Frontend

# Runs the renderer vitest suite and typechecks the codebase.
#
# The vitest suite is sharded and typechecking runs in its own job so the
# slowest pieces run in parallel.

on:
  workflow_call:
    inputs:
      lanes:
        type: string
        required: true
      vitest:
        type: string
        required: true

permissions:
  contents: read

jobs:
  typecheck:
    if: contains(fromJSON(inputs.lanes), 'frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # tsc needs Electron's types, not its binary; skip the flaky download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the source-build runtime in bootstrap-self-hosted.sh.
          node-version: 22.23.5

      - name: Check self-hosted npm lockfile compatibility
        run: npm ci --ignore-scripts --dry-run --no-audit --no-fund

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed; retrying Electron dependency download ($attempt/3)"
          done

      # tsconfig maps @aoagents/product-ui to its source, whose imports resolve
      # from packages/product-ui/node_modules.
      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Typecheck project
        run: npm run typecheck

      - name: Typecheck E2E suite
        run: npm run typecheck:e2e

  vitest:
    if: contains(fromJSON(inputs.lanes), 'frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/product-ui/package-lock.json

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed; retrying Electron dependency download ($attempt/3)"
          done

      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Prepare pinned agent-browser runtime
        run: npm run browser-runtime:prepare -- --quiet

      - name: Run vitest shard
        env:
          AO_AGENT_BROWSER_TEST_BINARY: ${{ github.workspace }}/frontend/agent-browser/agent-browser
          VITEST_FILES: ${{ inputs.vitest }}
        run: |
          mapfile -t always < scripts/ci-vitest-always-run.txt
          for f in "${always[@]}"; do
            test -f "$f" || { echo "::error::$f is in scripts/ci-vitest-always-run.txt but does not exist"; exit 1; }
          done
          if [ "$VITEST_FILES" = all ]; then
            npx vitest run --shard=${{ matrix.shard }}/2
          else
            read -ra related <<< "$VITEST_FILES"
            npx vitest related --run --passWithNoTests --shard=${{ matrix.shard }}/2 "${related[@]}" "${always[@]}"
          fi

  docs:
    if: contains(fromJSON(inputs.lanes), 'docs')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/src/docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/src/docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci

      # Re-extracts the docs catalogs, then fails if any locale is missing a
      # translation for a string in the source.
      - name: Check docs translations
        run: npm run check:i18n

      - name: Test docs
        run: npm test

      - name: Build docs
        run: npm run build

  boundary:
    if: contains(fromJSON(inputs.lanes), 'boundary')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed; retrying Electron dependency download ($attempt/3)"
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify terminal origin boundary in real Electron
        working-directory: backend
        run: |
          # Keep lazy-download output out of the executable-path capture.
          node ../frontend/node_modules/electron/install.js
          AO_MUX_ELECTRON="$(node -p "require('../frontend/node_modules/electron')")" xvfb-run -a go test -count=1 -run '^TestMuxOriginElectron$' ./internal/httpd

      - name: Verify daemon browser boundary in real Electron
        working-directory: backend
        run: |
          AO_BOUNDARY_ELECTRON="$(node -p "require('../frontend/node_modules/electron')")" xvfb-run -a go test -count=1 -run '^TestBrowserBoundaryElectron$' ./internal/httpd

      - name: Verify mobile control boundary in real Electron
        working-directory: backend
        run: |
          # Install first so lazy-download output cannot become part of the executable path.
          node ../frontend/node_modules/electron/install.js
          electron_binary="$(node -p "require('../frontend/node_modules/electron')")"
          test -x "$electron_binary"
          AO_MOBILE_CONTROL_ELECTRON="$electron_binary" xvfb-run -a go test -count=1 -run '^TestMobileControlOriginElectron$' ./internal/httpd

  postcondition:
    if: contains(fromJSON(inputs.lanes), 'frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm ci failed; retrying Electron dependency download ($attempt/3)"
          done

      - name: Prepare pinned agent-browser runtime
        run: npm run browser-runtime:prepare -- --quiet

      - name: Run guarded-navigation browser integration
        run: npm run test:browser-postcondition-integration

  cloud:
    if: contains(fromJSON(inputs.lanes), 'cloud')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/cloud-client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/cloud-client/package-lock.json

      - name: Install Cloud client dependencies
        run: npm ci

      - name: Verify Cloud contract and client
        run: |
          npm run generate
          git diff --exit-code -- src/schema.ts
          npm run typecheck
          npm test
          npm pack --dry-run

  product-ui:
    if: contains(fromJSON(inputs.lanes), 'product-ui')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/product-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/product-ui/package-lock.json

      - name: Install product UI dependencies
        run: npm ci

      - name: Verify product UI package
        run: |
          npm run typecheck
          npm test
          npm pack --dry-run

  renderer-smoke:
    # RENDERER smoke (issue #2483, renderer slice) — the Playwright specs that run
    # the renderer under `dev:web` with an injected window.ao + fake CDC/snapshot.
    # This is fast renderer-regression coverage; it is NOT the canonical T0/P0
    # end-to-end gate. Real daemon/storage/API/preload/PTY/FS boundaries are
    # exercised by the packaged-app pod gate (#2697), not here.
    # playwright.config starts `dev:web` itself (webServer); the pinned container
    # provides Chromium and its system dependencies without a live apt install.
    if: contains(fromJSON(inputs.lanes), 'frontend')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two runners, half the spec files each: the suite is bound by the single
    # Vite dev server, so more workers on one runner don't help.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      # Keep this aligned with Playwright in frontend/package-lock.json.
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 1001
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install product UI dependencies
        run: npm ci
        working-directory: packages/product-ui

      - name: Run renderer smoke suite
        run: CI=true npm run test:e2e:renderer -- --shard=${{ matrix.shard }}/2

      # Screenshots and attachments from failed specs, so a flaky pixel check
      # can be inspected instead of only re-run.
      - name: Upload renderer smoke results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # One name per attempt, so a re-run's upload can't clash with the first.
          name: renderer-smoke-results-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
